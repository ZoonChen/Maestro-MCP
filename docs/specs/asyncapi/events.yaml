components:
  schemas:
    ContractVersionedPayload:
      type: object
      additionalProperties: false
      required: [service, contract_version, canonical_hash, source_sha]
      properties:
        service:
          type: string
          minLength: 1
          maxLength: 255
        contract_version:
          type: string
          minLength: 1
          maxLength: 128
        canonical_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        source_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
    ContractBreakingPayload:
      type: object
      additionalProperties: false
      required: [service, consumer_hash, provider_hash, responsible_side, diff_summary]
      properties:
        service:
          type: string
          minLength: 1
        consumer_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        provider_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        responsible_side:
          enum: [consumer, provider, both, unknown]
        diff_summary:
          type: array
          uniqueItems: true
          maxItems: 100
          items:
            type: string
            maxLength: 200
    FindingPayload:
      type: object
      additionalProperties: false
      required: [finding_id, defect_id, source_type, severity, occurrence, evidence_refs, version]
      properties:
        finding_id:
          type: string
          format: uuid
        defect_id:
          type: string
          format: uuid
        source_type:
          enum: [pipeline, junit, contract, sast, secret, manual_qa]
        severity:
          enum: [critical, high, medium, low, info]
        occurrence:
          type: integer
          minimum: 1
        evidence_refs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        environment:
          type: string
          maxLength: 128
        repro:
          type: string
          maxLength: 8000
        version:
          type: integer
          minimum: 1
    DefectUniquedPayload:
      type: object
      additionalProperties: false
      required: [defect_id, fingerprint, occurrence, created, version]
      properties:
        defect_id:
          type: string
          format: uuid
        fingerprint:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        occurrence:
          type: integer
          minimum: 1
        created:
          type: boolean
        version:
          type: integer
          minimum: 1
    AgentHandoffPayload:
      type: object
      additionalProperties: false
      required: [execution_id, work_item_id, defect_id, handoff_reason, checkpoint_digest]
      properties:
        execution_id:
          type: string
          format: uuid
        work_item_id:
          type: string
          format: uuid
        defect_id:
          type: string
          format: uuid
        handoff_reason:
          enum: [cannot_reproduce, budget_exhausted, low_confidence, high_risk, tool_limit, policy_stop, human_review_required]
        checkpoint_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    BudgetExhaustedPayload:
      type: object
      additionalProperties: false
      required: [ledger_id, work_item_id, budget_tokens, spent_tokens, stop_reason]
      properties:
        ledger_id:
          type: string
          format: uuid
        work_item_id:
          type: string
          format: uuid
        budget_tokens:
          type: integer
          minimum: 1
        spent_tokens:
          type: integer
          minimum: 0
        stop_reason:
          enum: [budget_exhausted, attempt_limit, time_limit, manual_stop, policy_stop]
    Envelope:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - event_version
        - source
        - project_id
        - subject
        - occurred_at
        - correlation_id
        - causation_id
        - payload_digest
        - sensitivity
        - payload
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          pattern: "^[a-z][a-z0-9_.]+$"
        event_version:
          type: integer
          minimum: 1
        source:
          type: string
          minLength: 1
        project_id:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          minLength: 1
        causation_id:
          type: string
          minLength: 1
        payload_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        sensitivity:
          enum: [public, internal, confidential, restricted]
        payload:
          type: object
    GitLabWebhookPayload:
      type: object
      additionalProperties: false
      required: [instance_id, event_kind, delivery_key, received_at]
      properties:
        instance_id:
          type: string
          format: uuid
        event_kind:
          enum: [push, merge_request, pipeline, job]
        delivery_key:
          type: string
          minLength: 1
          description: >
            The per-delivery X-Gitlab-Event-UUID; with instance_id it is
            the Inbox deduplication primary key (S4 CE validation
            deviation 1: GitLab CE sends no X-Gitlab-Timestamp header,
            so replay protection is received_at + Event-UUID dedup plus
            a short acceptance window rather than signature timestamps).
        webhook_id:
          type: string
          minLength: 1
          description: >
            The per-webhook X-Gitlab-Webhook-UUID; used to verify the
            delivery belongs to the registered hook (anti-cross-wiring).
        received_at:
          type: string
          format: date-time
          description: Server receipt time; the replay-window anchor.
        payload_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    StateChangePayload:
      type: object
      additionalProperties: false
      required: [work_item_id, from, to, version]
      properties:
        work_item_id:
          type: string
          format: uuid
        from:
          type: [string, "null"]
          enum: [null, draft, queued, leased, executing, validating, ready_for_human_merge, done, blocked, cancelling, cancelled, failed, needs_human]
        to:
          type: string
          enum: [draft, queued, leased, executing, validating, ready_for_human_merge, done, blocked, cancelling, cancelled, failed, needs_human]
        version:
          type: integer
          minimum: 1
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
    GatePayload:
      type: object
      additionalProperties: false
      required: [gate_id, status, source_sha, target_sha, policy_version, evidence_ids]
      properties:
        gate_id:
          type: string
        status:
          enum: [pending, running, passed, failed, error, stale, waived]
        source_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        target_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        policy_version:
          type: string
        evidence_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    DefectPayload:
      type: object
      additionalProperties: false
      required: [defect_id, fingerprint, severity, occurrence, state, from, to, version]
      properties:
        defect_id:
          type: string
          format: uuid
        fingerprint:
          type: string
        severity:
          enum: [critical, high, medium, low, info]
        occurrence:
          type: integer
          minimum: 1
        state:
          enum: [detected, triaged, assigned, reproducing, fixing, verifying, resolved, ignored]
        from:
          type: [string, "null"]
          enum: [null, detected, triaged, assigned, reproducing, fixing, verifying, resolved, ignored]
        to:
          enum: [detected, triaged, assigned, reproducing, fixing, verifying, resolved, ignored]
        version:
          type: integer
          minimum: 1
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
    RunnerPresencePayload:
      type: object
      additionalProperties: false
      required: [runner_id, from, to, connection_generation, observed_at]
      properties:
        runner_id:
          type: string
          format: uuid
        from:
          enum: [pending_approval, approved, online, suspect, offline, draining, revoked]
        to:
          enum: [pending_approval, approved, online, suspect, offline, draining, revoked]
        connection_generation:
          type: string
          format: uuid
        observed_at:
          type: string
          format: date-time
    GitLabObjectPayload:
      type: object
      additionalProperties: false
      required: [instance_id, gitlab_project_id, object_type, object_id, state, observed_at]
      properties:
        instance_id:
          type: string
          format: uuid
        gitlab_project_id:
          type: integer
          minimum: 1
        object_type:
          enum: [merge_request, pipeline, job, branch]
        object_id:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        source_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        target_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        observed_at:
          type: string
          format: date-time
    WaiverPayload:
      type: object
      additionalProperties: false
      required: [waiver_id, gate_id, source_sha, state, expires_at, version]
      properties:
        waiver_id:
          type: string
          format: uuid
        gate_id:
          type: string
        source_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        state:
          enum: [requested, approved, rejected, active, expired, revoked]
        expires_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    IntegrationRunPayload:
      type: object
      additionalProperties: false
      required: [integration_run_id, state, phase, cleanup_status, combination_digest, version]
      properties:
        integration_run_id:
          type: string
          format: uuid
        state:
          enum: [waiting, running, passed, failed, cancelled, expired]
        phase:
          enum: [queued, contract_check, provisioning, executing, cleanup, complete]
        cleanup_status:
          enum: [not_started, running, passed, failed]
        combination_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        version:
          type: integer
          minimum: 1
    AgentExecutionPayload:
      type: object
      additionalProperties: false
      required: [execution_id, work_item_id, state, attempt, used_tokens, budget_tokens]
      properties:
        execution_id:
          type: string
          format: uuid
        work_item_id:
          type: string
          format: uuid
        state:
          enum: [eligibility_check, reproducing, diagnosing, modifying, local_verifying, retrying, mr_created, ci_verifying, awaiting_human, needs_human, stopped]
        attempt:
          type: integer
          minimum: 0
          maximum: 3
        used_tokens:
          type: integer
          minimum: 0
        budget_tokens:
          type: integer
          minimum: 1
    WorkGraphPlanPayload:
      type: object
      additionalProperties: false
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        human_code:
          type: string
          maxLength: 64
        problem_id:
          type: string
          format: uuid
        revision_no:
          type: integer
          minimum: 1
        supersedes:
          type: integer
          minimum: 0
        spec_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        overridden_nodes:
          type: integer
          minimum: 0
        carried_nodes:
          type: integer
          minimum: 0
    WorkGraphProposalPayload:
      type: object
      additionalProperties: false
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        violations:
          type: [array, "null"]
          items:
            type: object
        nodes:
          type: [array, "null"]
          items:
            type: string
            format: uuid
    WorkGraphNodePayload:
      type: object
      additionalProperties: false
      required: [node_id]
      properties:
        node_id:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 32
        attempt_id:
          type: string
          format: uuid
        context_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        worker_id:
          type: string
          maxLength: 128
        budget_units:
          type: integer
          minimum: 0
        outcome:
          type: string
          maxLength: 32
        usage_units:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 255
        children:
          type: integer
          minimum: 0
        cancel_policy:
          type: string
          maxLength: 32
        cancelled:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        detached:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        cancelled_ancestor:
          type: string
          format: uuid
    WorkGraphEdgePayload:
      type: object
      additionalProperties: false
      required: [plan_id]
      properties:
        plan_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        from:
          type: string
          format: uuid
        to:
          type: string
          format: uuid
        node:
          type: string
          format: uuid
        kind:
          type: string
          maxLength: 32
        slot_key:
          type: string
          maxLength: 64
        direction:
          type: string
          maxLength: 32
        asset:
          type: string
          pattern: "^ART-[a-z-]+-[0-9]{3,}@[0-9]+$"
        port:
          type: string
          maxLength: 64
    AssetPayload:
      type: object
      additionalProperties: false
      required: [asset]
      properties:
        asset:
          type: string
          pattern: "^ART-[a-z-]+-[0-9]{3,}@[0-9]+$"
        type:
          type: string
          maxLength: 32
        sensitivity:
          type: string
          maxLength: 32
        from:
          type: string
          maxLength: 32
        to:
          type: string
          maxLength: 32
        successor:
          type: string
          pattern: "^ART-[a-z-]+-[0-9]{3,}@[0-9]+$"
        stale_bindings:
          type: integer
          minimum: 0
        work_item:
          type: string
          format: uuid
        gate:
          type: string
          maxLength: 128
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        role:
          type: string
          maxLength: 32
        principal:
          type: string
          maxLength: 255
