openapi: 3.1.0
info:
  title: Maestro Runner API
  version: 3.0.0-draft
  license:
    name: Internal Proprietary
    identifier: LicenseRef-Internal-Proprietary
  description: |
    Outbound-only HTTPS long-poll/heartbeat/result protocol used by an enrolled
    local Runner. The bearer token determines runner identity; request bodies
    cannot override runner or project scope. This is not a WebSocket or mTLS API.
servers:
  - url: https://maestro.company.internal
security:
  - runnerToken: []
tags:
  - name: Runner enrollment
    description: One-time, project-bound Runner device enrollment.
  - name: Runner leases
    description: Outbound claim and heartbeat protocol for fenced work Leases.
  - name: Runner execution
    description: Diagnostic Evidence and terminal Execution outcome reporting.
paths:
  /api/v3/runners/enroll:
    post:
      tags: [Runner enrollment]
      summary: Enroll a Runner with a one-time project-bound code
      description: Exchanges a valid one-time registration code for a pending Runner identity.
      operationId: enrollRunner
      x-maestro-permission: runner.enroll_with_one_time_code
      x-maestro-audit-event: runner.enrolled
      x-maestro-idempotency: Idempotency-Key
      x-maestro-concurrency: enrollment_code single-use compare-and-swap
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Enrollment"
      responses:
        "201":
          description: Runner enrolled pending policy approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerCredential"
        "400":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v3/runner-leases/claim:
    post:
      tags: [Runner leases]
      summary: Long-poll for the next eligible Lease
      description: Claims at most one server-authorized Lease for the authenticated Runner.
      operationId: claimLease
      x-maestro-permission: runner.lease.claim
      x-maestro-audit-event: runner.lease.claimed
      x-maestro-idempotency: Idempotency-Key
      x-maestro-concurrency: connection_generation and scheduler queue version
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol_version, connection_generation, capabilities, wait_seconds]
              properties:
                protocol_version:
                  type: string
                  pattern: "^3\\.[0-9]+$"
                connection_generation:
                  type: string
                  format: uuid
                capabilities:
                  type: array
                  uniqueItems: true
                  minItems: 3
                  items:
                    $ref: "#/components/schemas/RunnerCapability"
                wait_seconds:
                  type: integer
                  minimum: 1
                  maximum: 30
      responses:
        "200":
          description: Lease or explicit no-work response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Lease"
                  - type: object
                    required: [available, retry_after_seconds]
                    properties:
                      available:
                        const: false
                      retry_after_seconds:
                        type: integer
                        minimum: 1
                        maximum: 60
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /api/v3/runner-leases/{leaseId}/heartbeat:
    post:
      tags: [Runner leases]
      summary: Renew an active Lease and report Runner liveness
      description: Renews the Lease deadline and records bounded Runner liveness information.
      operationId: heartbeatLease
      x-maestro-permission: runner.lease.heartbeat
      x-maestro-audit-event: runner.lease.heartbeat
      x-maestro-idempotency: Idempotency-Key
      x-maestro-concurrency: lease_version and connection_generation
      parameters:
        - name: leaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lease_version, connection_generation, observed_at]
              properties:
                lease_version:
                  type: integer
                  minimum: 1
                observed_at:
                  type: string
                  format: date-time
                connection_generation:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Lease extended
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v3/executions/{executionId}/evidence:
    post:
      tags: [Runner execution]
      summary: Upload non-authoritative local diagnostic Evidence
      description: Uploads bounded local diagnostics that cannot satisfy merge quality Gates.
      operationId: uploadDiagnosticEvidence
      x-maestro-permission: runner.evidence.upload_diagnostic
      x-maestro-audit-event: runner.evidence.recorded
      x-maestro-idempotency: Idempotency-Key
      x-maestro-concurrency: lease_version and connection_generation
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticEvidence"
      responses:
        "202":
          description: Evidence recorded as non-authoritative
        "413":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
  /api/v3/executions/{executionId}/complete:
    post:
      tags: [Runner execution]
      summary: Report an Execution outcome for workflow validation
      description: Reports an idempotent Execution outcome for server-side validation and transition.
      operationId: completeExecution
      x-maestro-permission: runner.execution.complete
      x-maestro-audit-event: runner.execution.completed
      x-maestro-idempotency: Idempotency-Key
      x-maestro-concurrency: lease_version and connection_generation
      parameters:
        - name: executionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionCompletion"
      responses:
        "202":
          description: Completion accepted for workflow processing
        "409":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    runnerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    Error:
      description: Stable error envelope
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [code, message, retryable, correlation_id]
            properties:
              code:
                type: string
                pattern: "^[A-Z][A-Z0-9_]+$"
              message:
                type: string
              retryable:
                type: boolean
              correlation_id:
                type: string
                format: uuid
  schemas:
    Enrollment:
      type: object
      additionalProperties: false
      required: [enrollment_code, device_public_key, display_name, capabilities]
      properties:
        enrollment_code:
          type: string
          minLength: 24
        device_public_key:
          type: string
          contentEncoding: base64
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        capabilities:
          type: array
          uniqueItems: true
          minItems: 3
          items:
            $ref: "#/components/schemas/RunnerCapability"
    RunnerCapability:
      type: string
      enum: [rootless_oci, no_new_privileges, keychain, git_broker_v1, resource_limits, network_policy, process_tree_kill]
    RunnerCredential:
      type: object
      additionalProperties: false
      required: [runner_id, state, access_token, expires_at]
      properties:
        runner_id:
          type: string
          format: uuid
        state:
          const: pending_approval
        access_token:
          type: string
          writeOnly: true
        expires_at:
          type: string
          format: date-time
    Lease:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - epoch
        - execution_id
        - work_item_id
        - project_id
        - repository
        - baseline_sha
        - workspace_generation
        - push_intent
        - expires_at
        - command_profiles
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        epoch:
          type: integer
          minimum: 1
        execution_id:
          type: string
          format: uuid
        work_item_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        repository:
          type: string
          format: uri
          pattern: "^https://"
        baseline_sha:
          type: string
          pattern: "^[0-9a-f]{40,64}$"
        workspace_generation:
          type: integer
          minimum: 1
        push_intent:
          $ref: "#/components/schemas/PushIntent"
        expires_at:
          type: string
          format: date-time
        command_profiles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/CommandProfileRef"
    CommandProfileRef:
      type: object
      additionalProperties: false
      required: [id, version, digest]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}$"
        version:
          type: string
          minLength: 1
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
    PushIntent:
      type: object
      additionalProperties: false
      description: Input to the Runner host broker; never exposed inside the OCI sandbox.
      required: [gitlab_instance_id, gitlab_project_id, expected_host, source_branch, expected_old_sha]
      properties:
        gitlab_instance_id:
          type: string
          format: uuid
        gitlab_project_id:
          type: integer
          minimum: 1
        expected_host:
          type: string
          format: hostname
        source_branch:
          type: string
          pattern: "^maestro/[a-z][a-z0-9-]{2,31}/[A-Za-z0-9._-]{1,64}$"
        expected_old_sha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40,64}$"
    DiagnosticEvidence:
      type: object
      additionalProperties: false
      required: [lease_id, lease_version, connection_generation, type, authority, producer, digest, created_at]
      properties:
        lease_id:
          type: string
          format: uuid
        lease_version:
          type: integer
          minimum: 1
        connection_generation:
          type: string
          format: uuid
        type:
          enum: [build, test, lint, coverage, diff, log]
        authority:
          const: diagnostic
        producer:
          const: local_runner
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        created_at:
          type: string
          format: date-time
        summary:
          type: string
          maxLength: 8000
    ExecutionCompletion:
      type: object
      additionalProperties: false
      required: [lease_id, lease_version, connection_generation, workspace_generation, outcome]
      properties:
        lease_id:
          type: string
          format: uuid
        lease_version:
          type: integer
          minimum: 1
        connection_generation:
          type: string
          format: uuid
        workspace_generation:
          type: integer
          minimum: 1
        outcome:
          enum: [completed, blocked, failed, cancelled]
        commit_sha:
          type: [string, "null"]
          pattern: "^[0-9a-f]{40,64}$"
        summary:
          type: string
          maxLength: 8000
      allOf:
        - if:
            properties:
              outcome:
                const: completed
          then:
            required: [commit_sha]
            properties:
              commit_sha:
                type: string
