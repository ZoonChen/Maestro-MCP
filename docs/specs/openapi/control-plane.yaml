openapi: 3.1.0
info:
  title: Maestro Control Plane API
  version: 3.0.0
  license:
    name: Internal Proprietary
    identifier: LicenseRef-Internal-Proprietary
  description: >-
    Maestro v3 central control-plane contract. Project scope, role and delegated
    session are derived from the authenticated server context and resource path;
    request bodies never establish authorization scope. The API does not expose
    source-branch push, protected-branch push or merge operations.
servers:
  - url: /api/v3
security:
  - oidcBearer: []
tags:
  - {name: Health, description: Liveness and readiness probes}
  - {name: Identity, description: Authenticated principal context}
  - {name: Projects, description: Team-scoped project governance}
  - {name: WorkItems, description: Project WorkItem lifecycle commands and views}
  - {name: Runners, description: Runner registration approval and revocation}
  - {name: GitLab, description: GitLab instances mappings merge requests and webhooks}
  - {name: Quality, description: Policies Gates Evidence and Waivers}
  - {name: Integration, description: Cross-repository IntegrationRuns}
  - {name: Defects, description: Defect triage and Agent remediation}
  - {name: Audit, description: Authorized audit export operations}
paths:
  /livez:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check whether the Control Plane process is alive
      description: Returns process liveness without testing downstream dependencies.
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
  /readyz:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether required dependencies permit serving traffic
      description: Returns readiness after checking dependencies required to serve requests.
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentPrincipal
      summary: Read the authenticated principal and effective memberships
      description: Returns server-derived identity and membership context for the caller.
      responses:
        '200':
          description: Authenticated principal and effective memberships
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrincipalContext'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /teams/{team_id}/projects:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
    get:
      tags: [Projects]
      operationId: listVisibleTeamProjects
      summary: List projects visible to the principal in a Team
      description: Lists only Projects visible to the authenticated principal within the Team.
      parameters:
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Projects visible to the principal
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a draft Project in an authorized Team
      description: Creates a Project scoped to the Team after authorization and idempotency checks.
      x-maestro-permission: project.create
      x-maestro-audit-event: project.created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectCreate'}
      responses:
        '201':
          description: Project created in draft
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Projects]
      operationId: getProject
      summary: Read a Project snapshot
      description: Returns the authorized Project's current persisted snapshot.
      responses:
        '200':
          description: Project
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update Project metadata or lifecycle state
      description: Applies an authorized optimistic update to Project metadata or state.
      x-maestro-permission: project.update
      x-maestro-audit-event: project.updated
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ProjectUpdate'}
      responses:
        '200':
          description: Updated project
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/work-items:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [WorkItems]
      operationId: listWorkItems
      summary: List WorkItems in an authorized Project
      description: Lists WorkItems visible within the server-authorized Project scope.
      parameters:
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Project-scoped WorkItems
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WorkItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [WorkItems]
      operationId: createWorkItem
      summary: Create a WorkItem in an authorized Project
      description: Creates an idempotent WorkItem using the caller's effective Project permissions.
      x-maestro-permission: work_item.create
      x-maestro-audit-event: work_item.created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkItemCreate'}
      responses:
        '201':
          description: WorkItem created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/work-items/{work_item_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WorkItemId'}
    get:
      tags: [WorkItems]
      operationId: getWorkItem
      summary: Read a WorkItem snapshot
      description: Returns the current authorized snapshot of a Project WorkItem.
      responses:
        '200':
          description: WorkItem snapshot
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/work-items/{work_item_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WorkItemId'}
    post:
      tags: [WorkItems]
      operationId: cancelWorkItem
      summary: Request cancellation of a WorkItem
      description: Records an idempotent cancellation request subject to state and concurrency checks.
      x-maestro-permission: work_item.cancel
      x-maestro-audit-event: work_item.cancel_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/work-items/{work_item_id}/retry:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WorkItemId'}
    post:
      tags: [WorkItems]
      operationId: retryWorkItem
      summary: Request a policy-eligible WorkItem retry
      description: Requests a retry only when policy, state, and retry limits permit it.
      x-maestro-permission: work_item.retry
      x-maestro-audit-event: work_item.retry_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/runner-registration-codes:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      tags: [Runners]
      operationId: createRunnerRegistrationCode
      summary: Create a one-time Project-bound Runner registration code
      description: Creates a single-use registration code that expires within ten minutes.
      x-maestro-permission: runner.registration_code.create
      x-maestro-audit-event: runner.registration_code_created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunnerRegistrationCodeCreate'}
      responses:
        '201':
          description: Registration code; plaintext is returned once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunnerRegistrationCode'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/runners:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Runners]
      operationId: listProjectRunners
      summary: List Runners bound to a Project
      description: Lists Runner identities and observed status within the authorized Project.
      responses:
        '200':
          description: Project-bound Runners
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Runner'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/runners/{runner_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/RunnerId'}
    post:
      tags: [Runners]
      operationId: approveRunner
      summary: Approve a pending Runner for the Project
      description: Approves a pending Project-bound Runner after authorization and version checks.
      x-maestro-permission: runner.approve
      x-maestro-audit-event: runner.approved
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunnerApproval'}
      responses:
        '200':
          description: Approved Runner
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Runner'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/runners/{runner_id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/RunnerId'}
    post:
      tags: [Runners]
      operationId: revokeRunner
      summary: Irreversibly revoke a Project Runner identity
      description: Revokes the Runner identity and prevents subsequent authenticated Runner activity.
      x-maestro-permission: runner.revoke
      x-maestro-audit-event: runner.revoked
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Irreversibly revoked Runner
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Runner'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /gitlab/instances:
    get:
      tags: [GitLab]
      operationId: listGitLabInstances
      summary: List configured GitLab instances without exposing Secrets
      description: Lists sanitized GitLab instance configuration visible to the platform administrator.
      responses:
        '200':
          description: Configured GitLab instances without secrets
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GitLabInstance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [GitLab]
      operationId: createGitLabInstance
      summary: Configure an approved GitLab instance
      description: Creates an audited HTTPS GitLab instance configuration without returning Secrets.
      x-maestro-permission: gitlab_instance.configure
      x-maestro-audit-event: gitlab.instance_created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitLabInstanceCreate'}
      responses:
        '201':
          description: GitLab instance created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabInstance'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/gitlab-mapping:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [GitLab]
      operationId: getGitLabProjectMapping
      summary: Read the Project GitLab repository mapping
      description: Returns the authorized Project's current GitLab repository mapping.
      responses:
        '200':
          description: Project repository mapping
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabProjectMapping'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [GitLab]
      operationId: putGitLabProjectMapping
      summary: Create or replace a Project GitLab repository mapping
      description: Applies an idempotent optimistic update to the Project repository mapping.
      x-maestro-permission: project.repository.manage
      x-maestro-audit-event: gitlab.project_mapping_changed
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-or-if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatchOptional'}
        - {$ref: '#/components/parameters/IfNoneMatchOptional'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitLabProjectMappingPut'}
      responses:
        '200':
          description: Mapping replaced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabProjectMapping'}
        '201':
          description: Mapping created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GitLabProjectMapping'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/gitlab/merge-requests/{merge_request_iid}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/MergeRequestIid'}
    get:
      tags: [GitLab]
      operationId: getMergeRequestProjection
      summary: Read the reconciled GitLab merge request projection
      description: Returns the cached projection last verified against GitLab facts.
      responses:
        '200':
          description: Read-only reconciled MR and Pipeline projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MergeRequestProjection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/work-items/{work_item_id}/merge-request:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WorkItemId'}
    post:
      tags: [GitLab]
      operationId: createWorkItemMergeRequest
      summary: Request creation of a WorkItem merge request without merging it
      description: >-
        Requests creation or idempotent update of an MR from the server-generated
        maestro task branch. This operation cannot push source or protected branches
        and cannot merge the MR.
      x-maestro-permission: gitlab.merge_request.create
      x-maestro-audit-event: gitlab.merge_request_create_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeRequestCreate'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/gitlab/merge-requests/{merge_request_iid}/reconcile:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/MergeRequestIid'}
    post:
      tags: [GitLab]
      operationId: reconcileMergeRequest
      summary: Request read-only reconciliation with GitLab facts
      description: Refreshes read models only; it cannot merge or push any branch.
      x-maestro-permission: gitlab.reconcile
      x-maestro-audit-event: gitlab.merge_request_reconcile_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconcileRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /webhooks/gitlab/{instance_id}:
    parameters:
      - {$ref: '#/components/parameters/GitLabInstanceId'}
    post:
      tags: [GitLab]
      operationId: ingestGitLabWebhook
      summary: Verify and durably persist a GitLab webhook event
      security:
        - webhookToken: []
      description: >-
        Verifies the raw payload before durable Inbox persistence. Deduplication
        uses X-Gitlab-Event-UUID when present, otherwise the raw payload digest.
      x-maestro-permission: webhook.gitlab.ingest
      x-maestro-audit-event: webhook.gitlab_received
      x-maestro-idempotency: event-id-or-raw-payload-sha256
      x-maestro-concurrency: inbox-unique-key
      parameters:
        - {$ref: '#/components/parameters/GitLabEventId'}
        - {$ref: '#/components/parameters/GitLabEventType'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202':
          description: Signature verified and event durably persisted
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /projects/{project_id}/quality-policy:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Quality]
      operationId: getEffectiveQualityPolicy
      summary: Read the effective inherited Quality Policy
      description: Returns the effective company and Project policy after monotonic inheritance.
      responses:
        '200':
          description: Effective inherited policy and provenance
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveQualityPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Quality]
      operationId: putProjectQualityPolicy
      summary: Strengthen the Project Quality Policy
      description: Project policy may only strengthen its company baseline.
      x-maestro-permission: project_policy.strengthen
      x-maestro-audit-event: quality.policy_changed
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-or-if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatchOptional'}
        - {$ref: '#/components/parameters/IfNoneMatchOptional'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QualityPolicyPut'}
      responses:
        '200':
          description: Policy replaced and versioned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveQualityPolicy'}
        '201':
          description: Project policy created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EffectiveQualityPolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/work-items/{work_item_id}/gates:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WorkItemId'}
    get:
      tags: [Quality]
      operationId: listWorkItemGates
      summary: List exact-SHA Gate snapshots for a WorkItem
      description: Lists Gate states bound to the WorkItem's exact source, target, and policy tuple.
      responses:
        '200':
          description: Gate snapshots for the exact source/target/policy tuple
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Gate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/work-items/{work_item_id}/evidence:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WorkItemId'}
    get:
      tags: [Quality]
      operationId: listWorkItemEvidence
      summary: List immutable Evidence for a WorkItem
      description: Lists immutable Evidence records authorized for the WorkItem scope.
      responses:
        '200':
          description: Immutable Evidence, including authority and exact SHA tuple
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Evidence'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/gates/{gate_id}/waivers:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/GateId'}
    post:
      tags: [Quality]
      operationId: requestGateWaiver
      summary: Request a time-limited waiver for one eligible Gate tuple
      description: Requests a maximum seven-day waiver bound to one MR, SHA and check.
      x-maestro-permission: waiver.request
      x-maestro-audit-event: quality.waiver_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WaiverRequest'}
      responses:
        '201':
          description: Waiver request awaiting a distinct approver
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Waiver'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/waivers/{waiver_id}/approve:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WaiverId'}
    post:
      tags: [Quality]
      operationId: approveGateWaiver
      summary: Independently approve an eligible Gate Waiver
      description: Approves a Waiver only when separation-of-duties and validity rules pass.
      x-maestro-permission: waiver.approve
      x-maestro-audit-event: quality.waiver_approved
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required-and-separation-of-duties
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Approved waiver
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Waiver'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/waivers/{waiver_id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/WaiverId'}
    post:
      tags: [Quality]
      operationId: revokeGateWaiver
      summary: Revoke an active Gate Waiver
      description: Revokes an active Waiver with optimistic concurrency and audit recording.
      x-maestro-permission: waiver.revoke
      x-maestro-audit-event: quality.waiver_revoked
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: Revoked waiver
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Waiver'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/integration-runs:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Integration]
      operationId: listIntegrationRuns
      summary: List cross-repository IntegrationRuns
      description: Lists IntegrationRuns visible within the authorized Project scope.
      responses:
        '200':
          description: Cross-repository IntegrationRuns
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IntegrationRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Integration]
      operationId: createIntegrationRun
      summary: Create an exact-combination IntegrationRun
      description: Creates an IntegrationRun bound to explicit repository SHAs and contract version.
      x-maestro-permission: integration_run.create
      x-maestro-audit-event: integration_run.created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationRunCreate'}
      responses:
        '201':
          description: IntegrationRun created
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/integration-runs/{integration_run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/IntegrationRunId'}
    post:
      tags: [Integration]
      operationId: cancelIntegrationRun
      summary: Request cancellation of an IntegrationRun
      description: Records an idempotent cancellation request for an eligible IntegrationRun.
      x-maestro-permission: integration_run.cancel
      x-maestro-audit-event: integration_run.cancel_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/defects:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Defects]
      operationId: listDefects
      summary: List normalized Defects in a Project
      description: Lists deduplicated Defects and their current lifecycle state in the Project.
      parameters:
        - {$ref: '#/components/parameters/PageCursor'}
      responses:
        '200':
          description: Deduplicated project Defects
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Defect'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/defects/{defect_id}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/DefectId'}
    get:
      tags: [Defects]
      operationId: getDefect
      summary: Read a Defect with occurrence and Evidence links
      description: Returns an authorized Defect snapshot with occurrence and Evidence references.
      responses:
        '200':
          description: Defect and occurrence summary
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Defect'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/defects/{defect_id}/triage:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/DefectId'}
    post:
      tags: [Defects]
      operationId: triageDefect
      summary: Triage and classify a Defect
      description: Applies an audited triage decision subject to state and concurrency checks.
      x-maestro-permission: defect.triage
      x-maestro-audit-event: defect.triaged
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DefectTriage'}
      responses:
        '200':
          description: Triaged Defect
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Defect'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/defects/{defect_id}/remediations:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/DefectId'}
    post:
      tags: [Defects]
      operationId: createRemediationRun
      summary: Start a budgeted Agent RemediationRun
      description: Starts remediation only after eligibility, permission, and budget validation.
      x-maestro-permission: remediation_run.create
      x-maestro-audit-event: remediation_run.created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemediationRunCreate'}
      responses:
        '201':
          description: Budgeted RemediationRun created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemediationRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/remediations/{remediation_run_id}/stop:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/RemediationRunId'}
    post:
      tags: [Defects]
      operationId: stopRemediationRun
      summary: Stop an Agent RemediationRun and hand off to a human
      description: Stops further Agent work and transitions the remediation to human handling.
      x-maestro-permission: remediation_run.stop
      x-maestro-audit-event: remediation_run.stop_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /audit/exports:
    post:
      tags: [Audit]
      operationId: createAuditExport
      summary: Create an authorized immutable Audit export operation
      description: Creates an audited export job for immutable records within authorized scope.
      x-maestro-permission: audit.export
      x-maestro-audit-event: audit.export_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditExportCreate'}
      responses:
        '202':
          description: Audit export accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webhookToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Resource locator only; authorization scope is server-derived.
      schema: {$ref: '#/components/schemas/Identifier'}
    WorkItemId:
      name: work_item_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerId:
      name: runner_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    GitLabInstanceId:
      name: instance_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    MergeRequestIid:
      name: merge_request_iid
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    GateId:
      name: gate_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    WaiverId:
      name: waiver_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    IntegrationRunId:
      name: integration_run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    DefectId:
      name: defect_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RemediationRunId:
      name: remediation_run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 512}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: true
      schema: {type: string, const: '*'}
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IfNoneMatchOptional:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string, const: '*'}
    GitLabEventId:
      name: X-Gitlab-Event-UUID
      in: header
      required: false
      schema: {type: string, maxLength: 128}
    GitLabEventType:
      name: X-Gitlab-Event
      in: header
      required: true
      schema: {type: string, maxLength: 128}
  headers:
    ETag:
      description: Strong aggregate version ETag.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    GitCommitSha:
      type: string
      pattern: '^[a-f0-9]{40,64}$'
    Timestamp:
      type: string
      format: date-time
    ResourceVersion:
      type: integer
      minimum: 1
    PrincipalContext:
      type: object
      additionalProperties: false
      required: [principal_id, subject, memberships]
      properties:
        principal_id: {$ref: '#/components/schemas/Identifier'}
        subject: {type: string, minLength: 1, maxLength: 255}
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [project_id, role]
            properties:
              project_id: {$ref: '#/components/schemas/Identifier'}
              role:
                type: string
                enum: [platform_admin, project_admin, coordinator, developer, verifier, viewer]
    ProjectState:
      type: string
      enum: [draft, configuring, active, suspended, archived]
    Project:
      type: object
      additionalProperties: false
      required: [id, team_id, key, name, state, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        team_id: {$ref: '#/components/schemas/Identifier'}
        key: {type: string, pattern: '^[a-z][a-z0-9-]{1,31}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        state: {$ref: '#/components/schemas/ProjectState'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9-]{1,31}$'}
        name: {type: string, minLength: 1, maxLength: 120}
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        state: {$ref: '#/components/schemas/ProjectState'}
    WorkItemState:
      type: string
      enum:
        - draft
        - queued
        - leased
        - executing
        - validating
        - ready_for_human_merge
        - done
        - blocked
        - cancelling
        - cancelled
        - failed
        - needs_human
    WorkItem:
      type: object
      additionalProperties: false
      required: [id, project_id, type, title, state, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, enum: [development, verification, integration, remediation]}
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        state: {$ref: '#/components/schemas/WorkItemState'}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        policy_version: {$ref: '#/components/schemas/Identifier'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    WorkItemCreate:
      type: object
      additionalProperties: false
      required: [type, title, repository_mapping_id, target_branch]
      properties:
        type: {type: string, enum: [development, verification, integration, remediation]}
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        repository_mapping_id: {$ref: '#/components/schemas/Identifier'}
        target_branch: {type: string, minLength: 1, maxLength: 255}
        command_profile_id: {$ref: '#/components/schemas/Identifier'}
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 8, maxLength: 2000}
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, const: accepted}
    RunnerState:
      type: string
      enum: [pending_approval, approved, online, suspect, offline, draining, revoked]
    Runner:
      type: object
      additionalProperties: false
      required: [id, project_id, display_name, state, capabilities, version, registered_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        display_name: {type: string, minLength: 1, maxLength: 120}
        state: {$ref: '#/components/schemas/RunnerState'}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [go, typescript, container, git]}
        command_profile_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        last_heartbeat_at:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
    RunnerRegistrationCodeCreate:
      type: object
      additionalProperties: false
      required: [display_name, capability_ceiling]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        capability_ceiling:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [go, typescript, container, git]}
    RunnerRegistrationCode:
      type: object
      additionalProperties: false
      required: [registration_code, expires_at, single_use]
      properties:
        registration_code: {type: string, minLength: 32, writeOnly: true}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        single_use: {type: boolean, const: true}
    RunnerApproval:
      type: object
      additionalProperties: false
      required: [command_profile_ids]
      properties:
        command_profile_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
    GitLabInstance:
      type: object
      additionalProperties: false
      required: [id, base_url, tls_verify, state, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        base_url: {type: string, format: uri, pattern: '^https://'}
        tls_verify: {type: boolean, const: true}
        state: {type: string, enum: [active, degraded, revoked]}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    GitLabInstanceCreate:
      type: object
      additionalProperties: false
      required: [base_url, bot_secret_ref, webhook_secret_ref]
      properties:
        base_url: {type: string, format: uri, pattern: '^https://'}
        bot_secret_ref: {type: string, minLength: 1, maxLength: 255}
        webhook_secret_ref: {type: string, minLength: 1, maxLength: 255}
    GitLabProjectMapping:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - gitlab_instance_id
        - gitlab_project_numeric_id
        - target_branch
        - state
        - version
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        gitlab_instance_id: {$ref: '#/components/schemas/Identifier'}
        gitlab_project_numeric_id: {type: integer, minimum: 1}
        target_branch: {type: string, minLength: 1, maxLength: 255}
        state: {type: string, enum: [pending, verified, degraded, revoked]}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    GitLabProjectMappingPut:
      type: object
      additionalProperties: false
      required: [gitlab_instance_id, gitlab_project_numeric_id, target_branch]
      properties:
        gitlab_instance_id: {$ref: '#/components/schemas/Identifier'}
        gitlab_project_numeric_id: {type: integer, minimum: 1}
        target_branch: {type: string, minLength: 1, maxLength: 255}
    MergeRequestProjection:
      type: object
      additionalProperties: false
      required: [iid, state, source_sha, target_sha, observed_at]
      properties:
        iid: {type: integer, minimum: 1}
        state: {type: string, enum: [opened, closed, merged]}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        pipeline_id: {type: integer, minimum: 1}
        observed_at: {$ref: '#/components/schemas/Timestamp'}
        stale: {type: boolean}
    MergeRequestCreate:
      type: object
      additionalProperties: false
      required: [title, source_sha, target_sha]
      properties:
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        draft: {type: boolean, default: true}
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 8, maxLength: 2000}
        force_provider_read: {type: boolean, default: false}
    GateState:
      type: string
      enum: [pending, running, passed, failed, error, stale, waived]
    Gate:
      type: object
      additionalProperties: false
      required: [id, project_id, work_item_id, check, required, state, source_sha, target_sha, policy_version, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        work_item_id: {$ref: '#/components/schemas/Identifier'}
        check: {type: string, minLength: 1, maxLength: 120}
        required: {type: boolean}
        state: {$ref: '#/components/schemas/GateState'}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        policy_version: {$ref: '#/components/schemas/Identifier'}
        evidence_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    Evidence:
      $ref: '../schemas/evidence.schema.json'
    QualityPolicy:
      $ref: '../schemas/quality-policy.schema.json'
    QualityPolicyPut:
      allOf:
        - $ref: '../schemas/quality-policy.schema.json'
        - type: object
          description: The project policy submitted to this endpoint MUST use scope=project.
          properties:
            scope: {const: project}
    EffectiveQualityPolicy:
      type: object
      additionalProperties: false
      required: [project_id, effective_policy, policy_digest, provenance]
      properties:
        project_id: {$ref: '#/components/schemas/Identifier'}
        effective_policy: {$ref: '#/components/schemas/QualityPolicy'}
        policy_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        provenance:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [scope, policy_id, version]
            properties:
              scope: {type: string, enum: [company, project, task]}
              policy_id: {type: string, minLength: 1, maxLength: 64}
              version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
              digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    Waiver:
      type: object
      additionalProperties: false
      required: [id, gate_id, status, requester_id, source_sha, merge_request_iid, check, expires_at, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        gate_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, enum: [requested, approved, rejected, active, expired, revoked]}
        requester_id: {$ref: '#/components/schemas/Identifier'}
        approver_id:
          oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        merge_request_iid: {type: integer, minimum: 1}
        check: {type: string, minLength: 1, maxLength: 120}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    WaiverRequest:
      type: object
      additionalProperties: false
      required: [source_sha, merge_request_iid, check, reason, expires_at]
      properties:
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        merge_request_iid: {type: integer, minimum: 1}
        check: {type: string, minLength: 1, maxLength: 120}
        reason: {type: string, minLength: 16, maxLength: 4000}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    IntegrationRunState:
      type: string
      enum: [waiting, running, passed, failed, cancelled, expired]
    RepositoryRevision:
      type: object
      additionalProperties: false
      required: [repository_mapping_id, sha]
      properties:
        repository_mapping_id: {$ref: '#/components/schemas/Identifier'}
        sha: {$ref: '#/components/schemas/GitCommitSha'}
        contract_version: {$ref: '#/components/schemas/Sha256'}
    IntegrationRun:
      type: object
      additionalProperties: false
      required: [id, project_id, revisions, environment_profile_id, state, phase, cleanup_status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        revisions:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/RepositoryRevision'}
        environment_profile_id: {$ref: '#/components/schemas/Identifier'}
        state: {$ref: '#/components/schemas/IntegrationRunState'}
        phase:
          type: string
          enum: [queued, contract_check, provisioning, executing, cleanup, complete]
        cleanup_status:
          type: string
          enum: [not_started, running, passed, failed]
        version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    IntegrationRunCreate:
      type: object
      additionalProperties: false
      required: [revisions, environment_profile_id]
      properties:
        revisions:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/RepositoryRevision'}
        environment_profile_id: {$ref: '#/components/schemas/Identifier'}
    DefectState:
      type: string
      enum: [detected, triaged, assigned, reproducing, fixing, verifying, resolved, ignored]
    Defect:
      type: object
      additionalProperties: false
      required: [id, project_id, fingerprint, source, severity, state, occurrence_count, version, first_seen_at, last_seen_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        fingerprint: {$ref: '#/components/schemas/Sha256'}
        source: {type: string, enum: [pipeline, junit, contract, sast, secret, manual_qa]}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        state: {$ref: '#/components/schemas/DefectState'}
        occurrence_count: {type: integer, minimum: 1}
        owner_principal_id:
          oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]
        disposition: {type: string, maxLength: 2000}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        first_seen_at: {$ref: '#/components/schemas/Timestamp'}
        last_seen_at: {$ref: '#/components/schemas/Timestamp'}
    DefectTriage:
      type: object
      additionalProperties: false
      required: [severity, disposition]
      properties:
        severity: {type: string, enum: [critical, high, medium, low, info]}
        owner_principal_id: {$ref: '#/components/schemas/Identifier'}
        disposition: {type: string, minLength: 8, maxLength: 2000}
    RemediationRunState:
      type: string
      enum:
        - eligibility_check
        - reproducing
        - diagnosing
        - modifying
        - local_verifying
        - retrying
        - mr_created
        - ci_verifying
        - awaiting_human
        - needs_human
        - stopped
    RemediationRun:
      type: object
      additionalProperties: false
      required: [id, project_id, defect_id, state, budget_tokens, used_tokens, max_attempts, attempt, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        defect_id: {$ref: '#/components/schemas/Identifier'}
        state: {$ref: '#/components/schemas/RemediationRunState'}
        budget_tokens: {type: integer, minimum: 1}
        used_tokens: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, maximum: 3}
        attempt: {type: integer, minimum: 0, maximum: 3}
        deadline_at: {$ref: '#/components/schemas/Timestamp'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    RemediationRunCreate:
      type: object
      additionalProperties: false
      required: [budget_tokens, reproduction_evidence_id, command_profile_id]
      properties:
        budget_tokens: {type: integer, minimum: 1}
        max_attempts: {type: integer, minimum: 1, maximum: 3, default: 3}
        timeout_minutes: {type: integer, minimum: 1, maximum: 30, default: 30}
        reproduction_evidence_id: {$ref: '#/components/schemas/Identifier'}
        command_profile_id: {$ref: '#/components/schemas/Identifier'}
    AuditExportCreate:
      type: object
      additionalProperties: false
      required: [from, to, format]
      properties:
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        project_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        format: {type: string, enum: [jsonl, csv]}
        include_prompt_trajectory: {type: boolean, default: false}
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, not_ready]}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
        message: {type: string}
        correlation_id: {type: string}
        details: {type: object, additionalProperties: true}
  responses:
    AcceptedOperation:
      description: Durable asynchronous operation accepted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationAccepted'}
    BadRequest:
      description: Malformed request (`INVALID_REQUEST`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication failed (`AUTHENTICATION_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authenticated principal lacks permission (`PERMISSION_DENIED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource absent or hidden by project visibility (`RESOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State, idempotency hash or uniqueness conflict (`STATE_CONFLICT`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionFailed:
      description: ETag no longer matches (`VERSION_CONFLICT`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Payload exceeds configured limit (`PAYLOAD_TOO_LARGE`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Unprocessable:
      description: Semantic validation or immutable rule failed (`VALIDATION_FAILED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: Required conditional header missing (`PRECONDITION_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: Dependency unavailable or fail-closed safety mode
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
