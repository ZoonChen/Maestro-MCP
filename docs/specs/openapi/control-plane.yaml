        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/jira-reconcile-items:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Jira]
      operationId: listJiraReconcileItems
      summary: List the project's Jira mirror divergence items
      description: >
        The reconcile list (blueprint section 1.2 rule 2): one item per
        diverged mirror field, live (open, then escalated after two
        reconcile cycles without adjudication) by default; the
        resolved history with state=resolved. A live item freezes its
        field's mirror push until a human adjudicates (accept_sor
        re-arms the push; accept_mirror rewrites the SoR-side value
        for title/assignee). Adjudication stays on the server-side
        surface this generation.
      x-maestro-permission: project.read
      parameters:
        - name: state
          in: query
          required: false
          schema: {type: string, enum: [live, resolved], default: live}
          description: live answers open+escalated; resolved answers history
      responses:
        '200':
          description: The divergence items, newest detection first
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JiraReconcileItemList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/pilot-flags/{flag}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/PilotFlagName'}
    put:
      tags: [Pilot]
      operationId: putPilotFlag
      summary: Record one pilot rollout decision
      description: >
        Records one rollout decision for the flag. The lifecycle guard
        is frozen: a new flag registers at off or starts at shadow;
        shadow → gray (with the percentage) → gray → full; any active
        stage may move to the terminal rolled_back. Illegal moves are
        409; invalid fields (reason shorter than 16 characters, a
        percentage outside gray) are 422; an identical replay is an
        idempotent no-op that audits nothing. Every recorded transition
        writes the pilot.decision.recorded audit row in the same
        transaction; the actor is the server-side principal and never
        travels in the body.
      x-maestro-permission: pilot.write
      x-maestro-audit-event: pilot.decision.recorded
      x-maestro-idempotency: required-header
      x-maestro-concurrency: stage-transition-guard
