    get:
      tags: [Jira]
      operationId: listJiraAnchors
      summary: List the project's WorkItem-to-issue anchors
      description: >
        W4.5 J3 read surface (SOLUTION-BLUEPRINT section 1): every
        anchor with both sides of the mirror — the SoR values (work
        item title/status live, assignee/iteration on the anchor) and
        the Jira-side read-only snapshot (title/assignee/labels/status,
