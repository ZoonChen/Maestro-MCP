          description: First audit sequence number in the slice (inclusive).
          schema: {type: integer, format: int64, minimum: 1}
        - name: to_seq
          in: query
          required: true
          description: Last audit sequence number in the slice (inclusive).
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: The audit chain export with per-entry digests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditChainExport'}
