        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/defects/{defect_id}/remediations:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/DefectId'}
    post:
      tags: [Defects]
      operationId: createRemediationRun
      summary: Start a budgeted Agent RemediationRun
      description: Starts remediation only after eligibility, permission, and budget validation.
      x-maestro-permission: remediation_run.create
      x-maestro-audit-event: remediation_run.created
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemediationRunCreate'}
      responses:
        '201':
          description: Budgeted RemediationRun created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RemediationRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /projects/{project_id}/remediations/{remediation_run_id}/stop:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/RemediationRunId'}
    post:
      tags: [Defects]
      operationId: stopRemediationRun
      summary: Stop an Agent RemediationRun and hand off to a human
      description: Stops further Agent work and transitions the remediation to human handling.
      x-maestro-permission: remediation_run.stop
      x-maestro-audit-event: remediation_run.stop_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '202': {$ref: '#/components/responses/AcceptedOperation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /audit/exports:
    post:
      tags: [Audit]
      operationId: createAuditExport
      summary: Create an authorized immutable Audit export operation
      description: Creates an audited export job for immutable records within authorized scope.
      x-maestro-permission: audit.export
      x-maestro-audit-event: audit.export_requested
      x-maestro-idempotency: required-header
      x-maestro-concurrency: if-none-match-required
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/IfNoneMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditExportCreate'}
      responses:
        '202':
          description: Audit export accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webhookToken:
      type: apiKey
      in: header
      name: X-Gitlab-Token
  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ProjectId:
      name: project_id
      in: path
      required: true
      description: Resource locator only; authorization scope is server-derived.
      schema: {$ref: '#/components/schemas/Identifier'}
    WorkItemId:
      name: work_item_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RunnerId:
      name: runner_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    GitLabInstanceId:
      name: instance_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    InboxId:
      name: inbox_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    MergeRequestIid:
      name: merge_request_iid
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    GateId:
      name: gate_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    WaiverId:
      name: waiver_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    PilotFlagName:
      name: flag
      in: path
      required: true
      description: The rollout flag's stable name (one per project).
      schema: {type: string, minLength: 1, maxLength: 128}
    IntegrationRunId:
      name: integration_run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    DefectId:
      name: defect_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    RemediationRunId:
      name: remediation_run_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: {type: string, maxLength: 512}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: true
      schema: {type: string, const: '*'}
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    IfNoneMatchOptional:
      name: If-None-Match
      in: header
      required: false
      schema: {type: string, const: '*'}
    GitLabEventId:
      name: X-Gitlab-Event-UUID
      in: header
      required: false
      schema: {type: string, maxLength: 128}
    GitLabEventType:
      name: X-Gitlab-Event
      in: header
      required: true
      schema: {type: string, maxLength: 128}
  headers:
    ETag:
      description: Strong aggregate version ETag.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    GitCommitSha:
      type: string
      pattern: '^[a-f0-9]{40,64}$'
    Timestamp:
      type: string
      format: date-time
    ResourceVersion:
      type: integer
      minimum: 1
    PrincipalContext:
      type: object
      additionalProperties: false
      required: [principal_id, subject, memberships]
      properties:
        principal_id: {$ref: '#/components/schemas/Identifier'}
        subject: {type: string, minLength: 1, maxLength: 255}
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [project_id, role]
            properties:
              project_id: {$ref: '#/components/schemas/Identifier'}
              role:
                type: string
                enum: [platform_admin, project_admin, coordinator, developer, verifier, viewer]
    ProjectState:
      type: string
      enum: [draft, configuring, active, suspended, archived]
    Project:
      type: object
      additionalProperties: false
      required: [id, team_id, key, name, state, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        team_id: {$ref: '#/components/schemas/Identifier'}
        key: {type: string, pattern: '^[a-z][a-z0-9-]{1,31}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        state: {$ref: '#/components/schemas/ProjectState'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9-]{1,31}$'}
        name: {type: string, minLength: 1, maxLength: 120}
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        state: {$ref: '#/components/schemas/ProjectState'}
    WorkItemState:
      type: string
      enum:
        - draft
        - queued
        - leased
        - executing
        - validating
        - ready_for_human_merge
        - done
        - blocked
        - cancelling
        - cancelled
        - failed
        - needs_human
    WorkItem:
      type: object
      additionalProperties: false
      required: [id, project_id, type, title, state, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        type: {type: string, enum: [development, verification, integration, remediation]}
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        state: {$ref: '#/components/schemas/WorkItemState'}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        policy_version: {$ref: '#/components/schemas/Identifier'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    WorkItemCreate:
      type: object
      additionalProperties: false
      required: [type, title, repository_mapping_id, target_branch]
      properties:
        type: {type: string, enum: [development, verification, integration, remediation]}
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        repository_mapping_id: {$ref: '#/components/schemas/Identifier'}
        target_branch: {type: string, minLength: 1, maxLength: 255}
        command_profile_id: {$ref: '#/components/schemas/Identifier'}
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 8, maxLength: 2000}
    OperationAccepted:
      type: object
      additionalProperties: false
      required: [operation_id, status]
      properties:
        operation_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, const: accepted}
    RunnerState:
      type: string
      enum: [pending_approval, approved, online, suspect, offline, draining, revoked]
    Runner:
      type: object
      additionalProperties: false
      required: [id, project_id, display_name, state, capabilities, version, registered_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        display_name: {type: string, minLength: 1, maxLength: 120}
        state: {$ref: '#/components/schemas/RunnerState'}
        capabilities:
          type: array
          uniqueItems: true
          items: {type: string, enum: [go, typescript, container, git]}
        command_profile_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        last_heartbeat_at:
          oneOf:
            - {$ref: '#/components/schemas/Timestamp'}
            - {type: 'null'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        registered_at: {$ref: '#/components/schemas/Timestamp'}
    RunnerRegistrationCodeCreate:
      type: object
      additionalProperties: false
      required: [display_name, capability_ceiling]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 120}
        capability_ceiling:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [go, typescript, container, git]}
    RunnerRegistrationCode:
      type: object
      additionalProperties: false
      required: [registration_code, expires_at, single_use]
      properties:
        registration_code: {type: string, minLength: 32, writeOnly: true}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        single_use: {type: boolean, const: true}
    RunnerApproval:
      type: object
      additionalProperties: false
      required: [command_profile_ids]
      properties:
        command_profile_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
    GitLabInstance:
      type: object
      additionalProperties: false
      required: [id, base_url, tls_verify, state, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        base_url: {type: string, format: uri, pattern: '^https://'}
        tls_verify: {type: boolean, const: true}
        state: {type: string, enum: [active, degraded, revoked]}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    GitLabInstanceCreate:
      type: object
      additionalProperties: false
      required: [base_url, bot_secret_ref, webhook_secret_ref]
      properties:
        base_url: {type: string, format: uri, pattern: '^https://'}
        bot_secret_ref: {type: string, minLength: 1, maxLength: 255}
        webhook_secret_ref: {type: string, minLength: 1, maxLength: 255}
    GitLabProjectMapping:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - gitlab_instance_id
        - gitlab_project_numeric_id
        - target_branch
        - state
        - version
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        gitlab_instance_id: {$ref: '#/components/schemas/Identifier'}
        gitlab_project_numeric_id: {type: integer, minimum: 1}
        target_branch: {type: string, minLength: 1, maxLength: 255}
        state: {type: string, enum: [pending, verified, degraded, revoked]}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    GitLabProjectMappingPut:
      type: object
      additionalProperties: false
      required: [gitlab_instance_id, gitlab_project_numeric_id, target_branch]
      properties:
        gitlab_instance_id: {$ref: '#/components/schemas/Identifier'}
        gitlab_project_numeric_id: {type: integer, minimum: 1}
        target_branch: {type: string, minLength: 1, maxLength: 255}
    MergeRequestProjection:
      type: object
      additionalProperties: false
      required: [iid, state, source_sha, target_sha, observed_at]
      properties:
        iid: {type: integer, minimum: 1}
        state: {type: string, enum: [opened, closed, merged]}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        pipeline_id: {type: integer, minimum: 1}
        observed_at: {$ref: '#/components/schemas/Timestamp'}
        stale: {type: boolean}
    MergeRequestCreate:
      type: object
      additionalProperties: false
      required: [title, source_sha, target_sha]
      properties:
        title: {type: string, minLength: 1, maxLength: 240}
        description: {type: string, maxLength: 20000}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        draft: {type: boolean, default: true}
    ReconcileRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 8, maxLength: 2000}
        force_provider_read: {type: boolean, default: false}
    GateState:
      type: string
      enum: [pending, running, passed, failed, error, stale, waived]
    Gate:
      type: object
      additionalProperties: false
      required: [id, project_id, work_item_id, check, required, state, source_sha, target_sha, policy_version, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        work_item_id: {$ref: '#/components/schemas/Identifier'}
        check: {type: string, minLength: 1, maxLength: 120}
        required: {type: boolean}
        state: {$ref: '#/components/schemas/GateState'}
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        target_sha: {$ref: '#/components/schemas/GitCommitSha'}
        policy_version: {$ref: '#/components/schemas/Identifier'}
        evidence_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    Evidence:
      $ref: '../schemas/evidence.schema.json'
    QualityPolicy:
      $ref: '../schemas/quality-policy.schema.json'
    QualityPolicyPut:
      allOf:
        - $ref: '../schemas/quality-policy.schema.json'
        - type: object
          description: The project policy submitted to this endpoint MUST use scope=project.
          properties:
            scope: {const: project}
    EffectiveQualityPolicy:
      type: object
      additionalProperties: false
      required: [project_id, effective_policy, policy_digest, provenance]
      properties:
        project_id: {$ref: '#/components/schemas/Identifier'}
        effective_policy: {$ref: '#/components/schemas/QualityPolicy'}
        policy_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        provenance:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [scope, policy_id, version]
            properties:
              scope: {type: string, enum: [company, project, task]}
              policy_id: {type: string, minLength: 1, maxLength: 64}
              version: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
              digest: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}
    Waiver:
      type: object
      additionalProperties: false
      required: [id, gate_id, status, requester_id, source_sha, merge_request_iid, check, expires_at, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        gate_id: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, enum: [requested, approved, rejected, active, expired, revoked]}
        requester_id: {$ref: '#/components/schemas/Identifier'}
        approver_id:
          oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        merge_request_iid: {type: integer, minimum: 1}
        check: {type: string, minLength: 1, maxLength: 120}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    DeadLetterReplay:
      type: object
      additionalProperties: false
      required: [requested_by, reason]
      properties:
        requested_by:
          type: string
          minLength: 1
          maxLength: 200
          description: The principal who diagnosed and requested the replay.
        approved_by:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Optional; when present it must name the authenticated principal —
            the server always derives the approver from the credential, never
            the body.
        reason:
          type: string
          minLength: 16
          maxLength: 2000
          description: Substantive justification recorded with the audit row.
    DeadLetterReplayResult:
      type: object
      additionalProperties: false
      required: [inbox_id, replayed]
      properties:
        inbox_id: {type: string, format: uuid}
        replayed: {type: boolean, const: true}
    AuditChainExport:
      type: object
      additionalProperties: false
      required: [schema_version, export_id, project_id, range, entries, chain_digest]
      properties:
        schema_version: {type: string, const: "3.0"}
        export_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        range:
          type: object
          additionalProperties: false
          required: [from_seq, to_seq]
          properties:
            from_seq: {type: integer, format: int64, minimum: 1}
            to_seq: {type: integer, format: int64, minimum: 1}
        entries:
          type: array
          items: {$ref: '#/components/schemas/AuditExportEntry'}
        chain_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        redaction:
          type: object
          additionalProperties: false
          properties:
            policy_version: {type: string, minLength: 1, maxLength: 64}
            fields_masked:
              type: array
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 64}
    AuditExportEntry:
      type: object
      additionalProperties: false
      required: [seq, event_id, event_type, principal, occurred_at, entry_digest]
      properties:
        seq: {type: integer, format: int64, minimum: 1}
        event_id: {type: string, format: uuid}
        event_type: {type: string, minLength: 1, maxLength: 128}
        principal: {type: string, minLength: 1, maxLength: 255}
        occurred_at: {$ref: '#/components/schemas/Timestamp'}
        correlation_id: {type: string, minLength: 1, maxLength: 128}
        resource: {type: string, minLength: 1, maxLength: 255}
        action: {type: string, minLength: 1, maxLength: 128}
        decision: {type: string, enum: [allow, deny, waived, neutral]}
        evidence_refs:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        prev_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        entry_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    AuditVerifyRequest:
      type: object
      additionalProperties: false
      required: [from_seq, to_seq, claimed_digests]
      properties:
        from_seq: {type: integer, format: int64, minimum: 1}
        to_seq: {type: integer, format: int64, minimum: 1}
        claimed_digests:
          type: array
          items: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    AuditVerifyResult:
      type: object
      additionalProperties: false
      required: [verified]
      properties:
        verified: {type: boolean}
    PilotStage:
      type: string
      description: >-
        The frozen rollout lifecycle: off → shadow → gray → full;
        rolled_back is the terminal stop and every active stage may move
        there directly (the kill switch).
      enum: [off, shadow, gray, full, rolled_back]
    PilotFlag:
      type: object
      additionalProperties: false
      required: [flag, stage, gray_percent, changed_by, reason, created_at, updated_at]
      properties:
        flag: {type: string, minLength: 1, maxLength: 128}
        stage: {$ref: '#/components/schemas/PilotStage'}
        gray_percent: {type: integer, minimum: 0, maximum: 100}
        changed_by: {type: string, minLength: 1, maxLength: 255}
        reason: {type: string, minLength: 16, maxLength: 2000}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    JiraAnchorList:
      type: object
      additionalProperties: false
      required: [project_id, anchors]
      properties:
        project_id: {type: string, format: uuid}
        anchors:
          type: array
          items: {$ref: '#/components/schemas/JiraAnchor'}
    JiraAnchor:
      type: object
      additionalProperties: false
      required: [work_item_id, issue_key, jira_project_key, anchor_source, sor_title, sor_status, sor_status_label, sor_assignee, sor_iteration_label, issue_title, issue_assignee, issue_labels, issue_status, last_mirror_ok]
      properties:
        work_item_id: {type: string, format: uuid}
        issue_key: {type: string, pattern: '^[A-Z][A-Z0-9_]*-[0-9]+$', examples: [PEIX-101]}
        jira_project_key: {type: string, pattern: '^[A-Z][A-Z0-9_]*$', examples: [PEIX]}
        anchor_source: {type: string, enum: [manual, api]}
        sor_title: {type: string}
        sor_status: {type: string}
        sor_status_label: {type: string, examples: ['maestro:executing']}
        sor_assignee: {type: string}
        sor_iteration_label: {type: string}
        issue_title: {type: string, description: Jira-side snapshot, read-only}
        issue_assignee: {type: string}
        issue_labels: {type: array, items: {type: string}}
        issue_status: {type: string, description: display-only; never feeds work item state}
        snapshot_at: {type: string, format: date-time, nullable: true}
        last_mirror_at: {type: string, format: date-time, nullable: true}
        last_mirror_ok: {type: boolean}
        last_error: {type: string}
    JiraReconcileItemList:
      type: object
      additionalProperties: false
      required: [project_id, items]
      properties:
        project_id: {type: string, format: uuid}
        items:
          type: array
          items: {$ref: '#/components/schemas/JiraReconcileItem'}
    JiraReconcileItem:
      type: object
      additionalProperties: false
      required: [id, issue_key, work_item_id, field, sor_value, mirror_value, state, open_cycles, detected_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        issue_key: {type: string}
        work_item_id: {type: string, format: uuid}
        field: {type: string, enum: [title, assignee, iteration_label, status_label]}
        sor_value: {type: string}
        mirror_value: {type: string}
        state: {type: string, enum: [open, escalated, resolved]}
        open_cycles: {type: integer, minimum: 1}
        detected_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        resolved_by: {type: string}
        resolved_at: {type: string, format: date-time, nullable: true}
        resolution: {type: string, enum: [accept_sor, accept_mirror]}
        resolution_note: {type: string}
    PilotFlagPut:
      type: object
      additionalProperties: false
      required: [stage, reason]
      properties:
        stage: {$ref: '#/components/schemas/PilotStage'}
        gray_percent:
          type: integer
          minimum: 0
          maximum: 100
          default: 0
          description: Only meaningful with the gray stage; zero elsewhere.
        reason:
          type: string
          minLength: 16
          maxLength: 2000
          description: The substantive rollout rationale recorded in the audit trail.
    PilotFlagList:
      type: object
      additionalProperties: false
      required: [project_id, flags]
      properties:
        project_id: {type: string, format: uuid}
        flags:
          type: array
          items: {$ref: '#/components/schemas/PilotFlag'}
    WaiverRequest:
      type: object
      additionalProperties: false
      required: [source_sha, merge_request_iid, check, reason, expires_at]
      properties:
        source_sha: {$ref: '#/components/schemas/GitCommitSha'}
        merge_request_iid: {type: integer, minimum: 1}
        check: {type: string, minLength: 1, maxLength: 120}
        reason: {type: string, minLength: 16, maxLength: 4000}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    IntegrationRunState:
      type: string
      enum: [waiting, running, passed, failed, cancelled, expired]
    RepositoryRevision:
      type: object
      additionalProperties: false
      required: [repository_mapping_id, sha]
      properties:
        repository_mapping_id: {$ref: '#/components/schemas/Identifier'}
        sha: {$ref: '#/components/schemas/GitCommitSha'}
        contract_version: {$ref: '#/components/schemas/Sha256'}
    IntegrationRun:
      type: object
      additionalProperties: false
      required: [id, project_id, revisions, environment_profile_id, state, phase, cleanup_status, version, created_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        revisions:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/RepositoryRevision'}
        environment_profile_id: {$ref: '#/components/schemas/Identifier'}
        state: {$ref: '#/components/schemas/IntegrationRunState'}
        phase:
          type: string
          enum: [queued, contract_check, provisioning, executing, cleanup, complete]
        cleanup_status:
          type: string
          enum: [not_started, running, passed, failed]
        version: {$ref: '#/components/schemas/ResourceVersion'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    IntegrationRunCreate:
      type: object
      additionalProperties: false
      required: [revisions, environment_profile_id]
      properties:
        revisions:
          type: array
          minItems: 2
          items: {$ref: '#/components/schemas/RepositoryRevision'}
        environment_profile_id: {$ref: '#/components/schemas/Identifier'}
    DefectState:
      type: string
      enum: [detected, triaged, assigned, reproducing, fixing, verifying, resolved, ignored]
    Defect:
      type: object
      additionalProperties: false
      required: [id, project_id, fingerprint, source, severity, state, occurrence_count, version, first_seen_at, last_seen_at]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        fingerprint: {$ref: '#/components/schemas/Sha256'}
        source: {type: string, enum: [pipeline, junit, contract, sast, secret, manual_qa]}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        state: {$ref: '#/components/schemas/DefectState'}
        occurrence_count: {type: integer, minimum: 1}
        owner_principal_id:
          oneOf: [{$ref: '#/components/schemas/Identifier'}, {type: 'null'}]
        disposition: {type: string, maxLength: 2000}
        version: {$ref: '#/components/schemas/ResourceVersion'}
        first_seen_at: {$ref: '#/components/schemas/Timestamp'}
        last_seen_at: {$ref: '#/components/schemas/Timestamp'}
    DefectTriage:
      type: object
      additionalProperties: false
      required: [severity, disposition]
      properties:
        severity: {type: string, enum: [critical, high, medium, low, info]}
        owner_principal_id: {$ref: '#/components/schemas/Identifier'}
        disposition: {type: string, minLength: 8, maxLength: 2000}
    RemediationRunState:
      type: string
      enum:
        - eligibility_check
        - reproducing
        - diagnosing
        - modifying
        - local_verifying
        - retrying
        - mr_created
        - ci_verifying
        - awaiting_human
        - needs_human
        - stopped
    RemediationRun:
      type: object
      additionalProperties: false
      required: [id, project_id, defect_id, state, budget_tokens, used_tokens, max_attempts, attempt, version]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        project_id: {$ref: '#/components/schemas/Identifier'}
        defect_id: {$ref: '#/components/schemas/Identifier'}
        state: {$ref: '#/components/schemas/RemediationRunState'}
        budget_tokens: {type: integer, minimum: 1}
        used_tokens: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1, maximum: 3}
        attempt: {type: integer, minimum: 0, maximum: 3}
        deadline_at: {$ref: '#/components/schemas/Timestamp'}
        version: {$ref: '#/components/schemas/ResourceVersion'}
    RemediationRunCreate:
      type: object
      additionalProperties: false
      required: [budget_tokens, reproduction_evidence_id, command_profile_id]
      properties:
        budget_tokens: {type: integer, minimum: 1}
        max_attempts: {type: integer, minimum: 1, maximum: 3, default: 3}
        timeout_minutes: {type: integer, minimum: 1, maximum: 30, default: 30}
        reproduction_evidence_id: {$ref: '#/components/schemas/Identifier'}
        command_profile_id: {$ref: '#/components/schemas/Identifier'}
    AuditExportCreate:
      type: object
      additionalProperties: false
      required: [from, to, format]
      properties:
        from: {$ref: '#/components/schemas/Timestamp'}
        to: {$ref: '#/components/schemas/Timestamp'}
        project_ids:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
        format: {type: string, enum: [jsonl, csv]}
        include_prompt_trajectory: {type: boolean, default: false}
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok, not_ready]}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]+$'}
        message: {type: string}
        correlation_id: {type: string}
        details: {type: object, additionalProperties: true}
  responses:
    AcceptedOperation:
      description: Durable asynchronous operation accepted
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationAccepted'}
    BadRequest:
      description: Malformed request (`INVALID_REQUEST`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Authentication failed (`AUTHENTICATION_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Authenticated principal lacks permission (`PERMISSION_DENIED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource absent or hidden by project visibility (`RESOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State, idempotency hash or uniqueness conflict (`STATE_CONFLICT`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionFailed:
      description: ETag no longer matches (`VERSION_CONFLICT`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: Payload exceeds configured limit (`PAYLOAD_TOO_LARGE`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    Unprocessable:
      description: Semantic validation or immutable rule failed (`VALIDATION_FAILED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    PreconditionRequired:
      description: Required conditional header missing (`PRECONDITION_REQUIRED`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
    ServiceUnavailable:
      description: Dependency unavailable or fail-closed safety mode
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Error'}
