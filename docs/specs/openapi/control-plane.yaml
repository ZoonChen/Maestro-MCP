        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PilotFlagPut'}
      responses:
        '200':
          description: Decision recorded or identical replay (no-op)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PilotFlag'}
        '201':
          description: Flag registered at its first recorded stage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PilotFlag'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
