    post:
      tags: [Audit]
      operationId: verifyAuditChain
      summary: Recompute the audit chain and compare claimed digests
      description: >
        The auditor's tamper check over an export: recomputes the chain for
        the range and compares it against the claimed per-entry digests. The
        If-Match precondition carries the chain digest of the export being
        verified.
      x-maestro-permission: audit.export
      x-maestro-audit-event: audit.exported
