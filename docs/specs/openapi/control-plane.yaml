        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /projects/{project_id}/audit-export:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      tags: [Audit]
      operationId: exportAuditChain
      summary: Export one project's append-only audit chain slice
      description: >
        Walks the immutable audit_events table in seq order and returns the
        frozen audit-export wire: ordered entries with deterministic uuid event
        ids, per-entry and rolling chain digests, and the redaction record.
