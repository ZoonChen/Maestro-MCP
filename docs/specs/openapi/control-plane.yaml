      description: >-
        Re-queues a dead-letter Inbox row under its ORIGINAL event identity:
        no re-verification bypass and no side-effect duplication. The approver
        identity is the authenticated principal; it must differ from
        requested_by (runbook section 9 dual-person control). The requeue, the
        approval and the audit row land in one transaction.
