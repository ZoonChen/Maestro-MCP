# golangci-lint configuration for Maestro-MCP
# GoLand reads this file to determine which linters to enable.
# Only linters that catch real bugs or meaningful quality issues are enabled.
# Style/formatting linters (wsl, nlreturn, tagliatelle, varnamelen, etc.) are intentionally omitted.

run:
  timeout: 3m
  modules-download-mode: readonly

linters:
  # Only enable linters listed here. All others are disabled by default.
  enable-only:
    # Bug detection
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck

    # Security & correctness
    - gosec
    - nilerr
    - wastedassign
    - errchkjson
    - intrange

    # Code quality
    - revive
    - misspell
    - dupl

linters-settings:
  revive:
    rules:
      - name: unused-parameter
        severity: warning
      - name: unreachable-code
      - name: context-as-argument
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
        disabled: true
      - name: blank-imports
  dupl:
    threshold: 200
  gosec:
    severity: medium
  misspell:
    locale: US

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  exclude-rules:
    - linters:
        - revive
        - dupl
      path: "_test.go"
